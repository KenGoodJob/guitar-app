<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ギター練習ツール(テスト)</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1b;--mut:#6b6a66;--card:#fff;--bd:#dedcd6;--ok:#1f9d55;--ng:#d64545;--ac:#2f6fed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--fg:#ecebe7;--mut:#9a9890;--card:#222220;--bd:#3a3935;--ok:#3ecf7a;--ng:#ff6b6b;--ac:#6c9bff}}
:root[data-theme="dark"]{--bg:#171716;--fg:#ecebe7;--mut:#9a9890;--card:#222220;--bd:#3a3935;--ok:#3ecf7a;--ng:#ff6b6b;--ac:#6c9bff}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif}
body{max-width:560px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button.on,#go{background:var(--ac);color:#fff;border-color:var(--ac)}
.mut{color:var(--mut);font-size:13px}
#nt{font-size:56px;font-weight:700;text-align:center;line-height:1.1}
#ct{text-align:center;color:var(--mut)}
#mt{position:relative;height:14px;border-radius:7px;background:var(--bd);margin:10px 4px}
#mt:before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--mut)}
#nd{position:absolute;top:-3px;width:6px;height:20px;border-radius:3px;background:var(--ng);transform:translateX(-50%);left:50%}
#nd.ok{background:var(--ok)}
.s{display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.s.cur{border-color:var(--ac)}.s.done{color:var(--ok)}
#cr{display:flex;gap:4px;align-items:flex-end;height:80px;margin-top:8px}
#cr div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
#cr i{display:block;background:var(--bd);border-radius:3px 3px 0 0;min-height:2px}
#cr .t i{background:var(--ac)}#cr .x i{background:var(--ng)}
#vd{font-size:18px;font-weight:700;margin:6px 0}
</style></head><body>
<h1>ギター練習ツール(テスト)</h1>
<div class="card">
<div class="row"><button id="go">マイク開始</button><select id="dev"></select></div>
<div id="msg" class="mut">開始を押して入力を許可してください(ケーブルは入力デバイスから選択)</div>
<div class="row"><label>チューニング <select id="tun"></select></label><label>A4 <input id="a4" type="number" value="440" min="415" max="466" style="width:4.5em"> Hz</label></div>
<div class="row"><label>入力ゲイン ×<span id="gv">8</span> <input id="gain" type="range" min="1" max="50" step="1" value="8"></label><label>感度(ゲート) <input id="gate" type="range" min="1" max="30" step="1" value="8"></label></div>
<div style="height:8px;background:var(--bd);border-radius:4px"><div id="lb" style="height:8px;width:0;background:var(--ac);border-radius:4px"></div></div>
<div class="mut">弦を弾いたとき、レベルバーが半分くらい振れるようにゲインを調整</div>
</div>
<div class="row"><button data-m="t" class="on">チューナー</button><button data-m="c">コード判定</button></div>
<div id="pt" class="card">
<div id="nt">–</div><div id="ct">弦を弾いてください</div><div id="mt"><div id="nd"></div></div>
<div id="sl"></div><button id="rs">リセット</button>
</div>
<div id="pc" class="card" hidden>
<div class="row" id="cb"></div>
<div class="mut" id="fr"></div>
<div id="vd">コードを弾いてください</div>
<div class="mut">弾いた直後の音を解析し、結果を保持します。</div>
<div id="cr"></div>
<div id="cs" style="margin-top:8px"></div>
<div class="mut">弦ごとの判定は参考値です(ミュート検出は目安)。</div>
</div>
<script>
const $=id=>document.getElementById(id);
const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const TUN={'レギュラー (EADGBE)':[40,45,50,55,59,64],'半音下げ':[39,44,49,54,58,63],'全音下げ':[38,43,48,53,57,62],'ドロップD':[38,45,50,55,59,64],'DADGAD':[38,45,50,55,57,62],'オープンG':[38,43,50,55,59,62]};
const CH={F:[1,3,3,2,1,1],C:[-1,3,2,0,1,0],G:[3,2,0,0,0,3],Am:[-1,0,2,2,1,0],Em:[0,2,2,0,0,0],D:[-1,-1,0,2,3,2],A:[-1,0,2,2,2,0],E:[0,2,2,1,0,0],Dm:[-1,-1,0,2,3,1],Bm:[-1,2,4,4,3,2]};
let gn,GATE=0.008,A4=440,tun=Object.values(TUN)[0],ctx,an,an2,buf,fb,stream,run=false,mode='t',chord='F',done=[],cnt=[];
const fq=m=>A4*Math.pow(2,(m-69)/12);
const nm=m=>NN[((m%12)+12)%12]+(Math.floor(m/12)-1);
Object.keys(TUN).forEach(k=>{const o=document.createElement('option');o.textContent=k;$('tun').appendChild(o)});
$('tun').onchange=()=>{tun=TUN[$('tun').value];resetT();drawS(-1);drawFr()};
$('a4').onchange=()=>{A4=+$('a4').value||440;drawS(-1)};
function resetT(){done=[];cnt=[]}
$('rs').onclick=()=>{resetT();drawS(-1)};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b));$('pt').hidden=mode!=='t';$('pc').hidden=mode!=='c'});
Object.keys(CH).forEach(k=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{chord=k;[...$('cb').children].forEach(x=>x.classList.toggle('on',x===b));$('vd').textContent='コードを弾いてください';$('cr').innerHTML='';$('cs').innerHTML='';att=0;drawFr()};if(k===chord)b.classList.add('on');$('cb').appendChild(b)});
function drawFr(){$('fr').textContent='押さえ方(6弦→1弦): '+CH[chord].map(x=>x<0?'x':x).join(' ')}
function drawS(cur){$('sl').innerHTML=[5,4,3,2,1,0].map(i=>`<div class="s ${i===cur?'cur':''} ${done[i]?'done':''}"><span>${6-i}弦 ${nm(tun[i])}</span><span>${fq(tun[i]).toFixed(1)} Hz ${done[i]?'✓':''}</span></div>`).join('')}
drawS(-1);drawFr();
async function start(){
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  const v=$('dev').value;
  stream=await navigator.mediaDevices.getUserMedia({audio:{deviceId:v?{exact:v}:undefined,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  await ctx.resume();
  const src=ctx.createMediaStreamSource(stream);
  an=ctx.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=0;
  an2=ctx.createAnalyser();an2.fftSize=32768;an2.smoothingTimeConstant=0;
  gn=ctx.createGain();gn.gain.value=+$('gain').value;src.connect(gn);gn.connect(an);gn.connect(an2);
  buf=new Float32Array(an.fftSize);fb=new Float32Array(an2.frequencyBinCount);
  const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
  const cur=stream.getAudioTracks()[0].getSettings().deviceId;
  $('dev').innerHTML=ds.map(d=>`<option value="${d.deviceId}" ${d.deviceId===cur?'selected':''}>${d.label||'入力'}</option>`).join('');
  const tk=stream.getAudioTracks()[0];$('msg').textContent='使用中の入力: '+(tk.label||'(名称なし)')+' / '+Math.round(ctx.sampleRate)+' Hz / 一覧'+ds.length+'件';
  if(!run){run=true;requestAnimationFrame(loop)}
 }catch(e){$('msg').textContent='マイクを開始できません: '+e.message}
}
$('go').onclick=start;$('dev').onchange=start;
$('gain').oninput=()=>{$('gv').textContent=$('gain').value;if(gn)gn.gain.value=+$('gain').value};
$('gate').oninput=()=>{GATE=+$('gate').value/1000};
let last=0;
function loop(t){requestAnimationFrame(loop);if(!an||t-last<50)return;last=t;
 an.getFloatTimeDomainData(buf);
 let r=0;for(let i=buf.length-4096;i<buf.length;i++)r+=buf[i]*buf[i];r=Math.sqrt(r/4096);$('lb').style.width=Math.min(100,r*500)+'%';
 mode==='t'?tuner(r):chordStep(r,t)}
function yin(b,sr){
 const W=2048,minT=Math.floor(sr/1000),maxT=Math.floor(sr/60),o=b.length-W-maxT-1,d=new Float32Array(maxT+1),n=new Float32Array(maxT+1);
 for(let k=1;k<=maxT;k++){let s=0;for(let j=0;j<W;j++){const x=b[o+j]-b[o+j+k];s+=x*x}d[k]=s}
 let sum=0;for(let k=1;k<=maxT;k++){sum+=d[k];n[k]=d[k]*k/(sum||1)}
 for(let k=minT;k<maxT-1;k++){if(n[k]<0.15){while(k+1<maxT&&n[k+1]<n[k])k++;
  const a=n[k-1],c=n[k],e=n[k+1],den=a-2*c+e,p=den?k+0.5*(a-e)/den:k;return sr/p}}
 return -1}
function tuner(r){
 if(r<GATE){$('nt').textContent='–';$('ct').textContent='弦を弾いてください';return}
 const f=yin(buf,ctx.sampleRate);if(f<0)return;
 const m=69+12*Math.log2(f/A4);
 let bi=0;tun.forEach((x,i)=>{if(Math.abs(m-x)<Math.abs(m-tun[bi]))bi=i});
 const near=Math.abs(m-tun[bi])<2.5,tm=near?tun[bi]:Math.round(m),c=(m-tm)*100;
 $('nt').textContent=nm(tm);
 $('ct').textContent=f.toFixed(1)+' Hz / '+(c>0?'+':'')+c.toFixed(0)+' cent'+(near?'':'(弦から遠い音)');
 $('nd').style.left=Math.max(0,Math.min(100,50+c))+'%';
 $('nd').classList.toggle('ok',Math.abs(c)<=5);
 if(near){cnt[bi]=Math.abs(c)<=5?(cnt[bi]||0)+1:0;if(cnt[bi]>=6)done[bi]=true}
 drawS(near?bi:-1)}
let att=0,prev=0,acc,sacc,n=0;
const g=k=>Math.max(fb[k],-160);
function pcs(){return CH[chord].map((x,i)=>x<0?-1:(tun[i]+x)%12).filter(x=>x>=0)}
function analyze(){
 const bw=ctx.sampleRate/an2.fftSize,ch=new Float32Array(12),st=[],fr=CH[chord];
 for(let k=Math.floor(70/bw);k<=Math.ceil(1500/bw);k++){const m=69+12*Math.log2(k*bw/A4),q=Math.round(m);if(Math.abs(m-q)<0.4)ch[((q%12)+12)%12]+=Math.pow(10,g(k)/10)}
 tun.forEach((o,i)=>{if(fr[i]<0){st.push(null);return}
  const f0=fq(o+fr[i]),K=c=>Math.round(f0*Math.pow(2,c/1200)/bw);
  let pk=-200;for(let k=K(-40);k<=K(40);k++)pk=Math.max(pk,g(k));
  let s=0,c2=0;for(const [a,b] of [[100,250],[-250,-100]])for(let k=K(a);k<=K(b);k++){s+=g(k);c2++}
  st.push(pk-s/Math.max(c2,1))});
 return{ch,st}}
function chordStep(r,t){
 if(r>GATE*2.5&&prev<GATE*1.5){att=t;acc=new Float32Array(12);sacc=new Float32Array(6);n=0;$('vd').textContent='解析中…'}
 prev=r;if(!att)return;
 const dt=t-att;
 if(dt>=150&&dt<=800){an2.getFloatFrequencyData(fb);const a=analyze();a.ch.forEach((v,i)=>acc[i]+=v);a.st.forEach((v,i)=>sacc[i]+=v===null?0:v);n++}
 if(dt>800){att=0;if(n)showC()}}
function showC(){
 const mx=Math.max(...acc)||1,rel=[...acc].map(v=>v/mx),req=[...new Set(pcs())];
 const miss=req.filter(p=>rel[p]<0.12),extra=[...Array(12).keys()].filter(p=>!req.includes(p)&&rel[p]>0.35);
 const ok=!miss.length&&!extra.length;
 $('vd').style.color=ok?'var(--ok)':'var(--ng)';
 $('vd').textContent=ok?chord+' OK':chord+' NG'+(miss.length?' 不足: '+miss.map(p=>NN[p]).join(' '):'')+(extra.length?' 余分: '+extra.map(p=>NN[p]).join(' '):'');
 $('cr').innerHTML=rel.map((v,i)=>`<div class="${req.includes(i)?'t':extra.includes(i)?'x':''}"><i style="height:${Math.round(v*60)}px"></i>${NN[i]}</div>`).join('');
 const fr=CH[chord];
 $('cs').innerHTML=[5,4,3,2,1,0].map(i=>{const m=fr[i]<0,v=sacc[i]/n,good=v>=12;
  return`<div class="s"><span>${6-i}弦 ${m?'×(弾かない)':nm(tun[i]+fr[i])}</span><span style="color:${m?'var(--mut)':good?'var(--ok)':'var(--ng)'}">${m?'–':good?'鳴っている':'弱い/ミュート?'}</span></div>`}).join('')}
</script></body></html>
