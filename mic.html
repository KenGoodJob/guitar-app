<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ギター練習 マイクモード</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1b;--mut:#6b6a66;--card:#fff;--bd:#dedcd6;--ok:#1f9d55;--ng:#d64545;--ac:#2f6fed}
@media(prefers-color-scheme:dark){:root{--bg:#171716;--fg:#ecebe7;--mut:#9a9890;--card:#222220;--bd:#3a3935;--ok:#3ecf7a;--ng:#ff6b6b;--ac:#6c9bff}}
html,body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif}
body{max-width:720px;margin:0 auto;padding:12px env(safe-area-inset-right,12px) 40px env(safe-area-inset-left,12px)}
h1{font-size:19px;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;min-height:44px;box-sizing:border-box}
input[type=range]{padding:0;min-height:32px}
input[type=checkbox]{min-height:0;width:20px;height:20px}
button.on,#go{background:var(--ac);color:#fff;border-color:var(--ac)}
.mut{color:var(--mut);font-size:14px}
.bar{height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:10px;width:0;background:var(--ac)}
#nt{font-size:64px;font-weight:700;text-align:center;line-height:1.1}
#ct{text-align:center;font-size:20px}
#mt{position:relative;height:16px;border-radius:8px;background:var(--bd);margin:12px 4px}
#mt:before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--mut)}
#nd{position:absolute;top:-4px;width:8px;height:24px;border-radius:4px;background:var(--ng);transform:translateX(-50%);left:50%}
#nd.ok{background:var(--ok)}
.s{display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.s.cur{border-color:var(--ac)}.s.done{color:var(--ok)}
#cr{display:flex;gap:4px;align-items:flex-end;height:110px;margin:8px 0}
#cr div{flex:1;text-align:center;font-size:12px;color:var(--mut)}
#cr i{display:block;background:var(--bd);border-radius:3px 3px 0 0;min-height:2px}
#cr .t i{background:var(--ac)}#cr .t.ok i{background:var(--ok)}#cr .x i{background:#c9a0a0}
#vd{font-size:24px;font-weight:700;margin:6px 0}
</style></head><body>
<h1>ギター練習 マイクモード(テスト)</h1>
<div class="card">
<div class="row"><button id="go">マイク開始</button><label class="mut"><input type="checkbox" id="agc"> 自動ゲイン(次回の開始から)</label></div>
<div id="msg" class="mut">開始を押して、マイクを許可してください</div>
<div class="row"><label>ゲイン ×<span id="gv">10</span> <input id="gain" type="range" min="1" max="60" value="10"></label></div>
<div class="bar"><i id="lb"></i></div>
<div class="row"><button id="cal">雑音を測る(2秒・弾かない)</button><span id="nz" class="mut"></span></div>
</div>
<div class="row"><button class="tab on" data-m="t">チューナー</button><button class="tab" data-m="c">コード判定</button></div>

<div id="pt" class="card">
<div class="row"><label>チューニング <select id="tun"></select></label><label>A4 <input id="a4" type="number" value="440" min="415" max="466" style="width:5em"> Hz</label></div>
<div class="row" id="sb"></div>
<div id="nt">–</div><div id="ct">弦を弾いてください</div><div id="mt"><div id="nd"></div></div>
<div id="info" class="mut" style="text-align:center"></div>
<div id="sl"></div>
<div class="row"><button id="rs">リセット</button><label>OKの範囲 <select id="tol"><option value="3">±3</option><option value="5" selected>±5</option><option value="8">±8</option><option value="12">±12</option></select> cent</label></div>
<div class="row"><label>検出のしきい値 <b id="ttv">15</b> dB <input id="tth" type="range" min="6" max="35" value="15"></label></div>
<div class="mut">1本ずつ弾きます。「1弦」などを選ぶと、その弦の音だけを探すので、安定します(おまかせは、E2とB3、A2とE4のように、倍音が重なる弦を取り違えることがあります)。</div>
</div>

<div id="pc" class="card" hidden>
<div class="row" id="cb"></div>
<div id="vd">コードを弾いてください</div>
<div id="cr"></div>
<div class="row"><label>判定のしきい値 <b id="ctv">20</b> dB <input id="cth" type="range" min="8" max="40" value="20"></label></div>
<div class="mut">青=コードの構成音(緑=検出)、赤みがかった棒=構成音以外。構成音がすべて検出されるとOKです。余分な音は、倍音の影響でも出るので、参考表示です。フレットの位置は、標準チューニングの押さえ方です。</div>
<div id="cs" class="mut"></div>
</div>
<script>
function peakNear(fb,bw,f,tol){
  const lo=Math.max(2,Math.floor(f*Math.pow(2,-tol/1200)/bw)),hi=Math.min(fb.length-3,Math.ceil(f*Math.pow(2,tol/1200)/bw));
  if(hi<lo)return null;
  let m=-1e9,mi=lo;for(let i=lo;i<=hi;i++)if(fb[i]>m){m=fb[i];mi=i}
  const a=fb[mi-1],b=fb[mi],c=fb[mi+1],d=a-2*b+c,o=d?0.5*(a-c)/d:0;
  return{f:(mi+Math.max(-0.5,Math.min(0.5,o)))*bw,db:b};
}
function floorNear(fb,bw,f,excl,span){
  const r=c=>f*Math.pow(2,c/1200)/bw;
  const a=Math.max(2,Math.floor(r(-span))),b=Math.min(fb.length-2,Math.ceil(r(span))),x=r(-excl),y=r(excl);
  let s=0,n=0;for(let i=a;i<=b;i++){if(i>=x&&i<=y)continue;s+=fb[i];n++}
  return n?s/n:-160;
}
function noteScan(fb,bw,ft,kmax,tol,sr){
  let best=null;
  for(let k=1;k<=kmax;k++){const fk=ft*k;if(fk>Math.min(2500,sr*0.45))break;
    const p=peakNear(fb,bw,fk,tol);if(!p)continue;
    const prom=p.db-floorNear(fb,bw,fk,tol*1.5,tol*4);
    if(!best||prom>best.prom+1.5)best={k,prom,cents:1200*Math.log2(p.f/fk)};
  }
  return best;
}
function pcStrength(fb,bw,pc,sr,A4){
  let best=-99;
  for(let o=2;o<=5;o++){const m=12*(o+1)+pc,f=A4*Math.pow(2,(m-69)/12);if(f<75||f>1000)continue;
    const p=peakNear(fb,bw,f,40);if(!p)continue;
    const prom=p.db-floorNear(fb,bw,f,60,300);if(prom>best)best=prom}
  return best;
}

const $=id=>document.getElementById(id);
const NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const TUN={'レギュラー (EADGBE)':[40,45,50,55,59,64],'半音下げ':[39,44,49,54,58,63],'全音下げ':[38,43,48,53,57,62],'ドロップD':[38,45,50,55,59,64],'DADGAD':[38,45,50,55,57,62],'オープンG':[38,43,50,55,59,62]};
const STD=[40,45,50,55,59,64];
const CH={F:[1,3,3,2,1,1],C:[-1,3,2,0,1,0],G:[3,2,0,0,0,3],Am:[-1,0,2,2,1,0],Em:[0,2,2,0,0,0],D:[-1,-1,0,2,3,2],A:[-1,0,2,2,2,0],E:[0,2,2,1,0,0],Dm:[-1,-1,0,2,3,1],Bm:[-1,2,4,4,3,2],E7:[0,2,0,1,0,0],A7:[-1,0,2,0,2,0],D7:[-1,-1,0,2,1,2]};
let A4=440,tun=TUN['レギュラー (EADGBE)'].slice(),ctx,an,gn,buf,fb,stream,run=false,mode='t',sel=-1,chord='F',noise=0,calUntil=0,calSum=0,calN=0,done=[],okc=[],hist=[[],[],[],[],[],[]],cok=0,cokUntil=0,last=0;
const fq=m=>A4*Math.pow(2,(m-69)/12);
const nm=m=>NN[((m%12)+12)%12]+(Math.floor(m/12)-1);
$('tun').innerHTML=Object.keys(TUN).map(k=>`<option>${k}</option>`).join('');
$('tun').onchange=()=>{tun=TUN[$('tun').value].slice();done=[];okc=[];drawS(-1)};
$('a4').onchange=()=>{A4=+$('a4').value||440;drawS(-1)};
$('rs').onclick=()=>{done=[];okc=[];drawS(-1)};
$('tth').oninput=()=>{$('ttv').textContent=$('tth').value};
$('cth').oninput=()=>{$('ctv').textContent=$('cth').value};
$('gain').oninput=()=>{$('gv').textContent=$('gain').value;if(gn)gn.gain.value=+$('gain').value};
$('sb').innerHTML=['おまかせ','1弦','2弦','3弦','4弦','5弦','6弦'].map((t,i)=>`<button class="sbtn${i===0?' on':''}" data-i="${i}">${t}</button>`).join('');
$('sb').onclick=e=>{const b=e.target.closest('.sbtn');if(!b)return;const i=+b.dataset.i;sel=i===0?-1:6-i;document.querySelectorAll('.sbtn').forEach(x=>x.classList.toggle('on',x===b));hist=[[],[],[],[],[],[]]};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));$('pt').hidden=mode!=='t';$('pc').hidden=mode!=='c'});
$('cb').innerHTML=Object.keys(CH).map(k=>`<button class="cbtn${k===chord?' on':''}" data-k="${k}">${k}</button>`).join('');
$('cb').onclick=e=>{const b=e.target.closest('.cbtn');if(!b)return;chord=b.dataset.k;document.querySelectorAll('.cbtn').forEach(x=>x.classList.toggle('on',x===b));cok=0;cokUntil=0;$('vd').textContent='コードを弾いてください';$('vd').style.color=''};
function drawS(cur){$('sl').innerHTML=[5,4,3,2,1,0].map(i=>`<div class="s ${i===cur?'cur':''} ${done[i]?'done':''}"><span>${6-i}弦 ${nm(tun[i])}</span><span>${fq(tun[i]).toFixed(1)} Hz ${done[i]?'✓':''}</span></div>`).join('')}
drawS(-1);
$('cal').onclick=()=>{if(!an){$('nz').textContent='先にマイク開始を押してください';return}calUntil=performance.now()+2000;calSum=0;calN=0;$('nz').textContent='測定中…'};
async function start(){
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:$('agc').checked}});
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  await ctx.resume();
  const src=ctx.createMediaStreamSource(stream);
  gn=ctx.createGain();gn.gain.value=+$('gain').value;
  an=ctx.createAnalyser();an.fftSize=32768;an.smoothingTimeConstant=0;
  src.connect(gn);gn.connect(an);
  buf=new Float32Array(2048);fb=new Float32Array(an.frequencyBinCount);
  const tk=stream.getAudioTracks()[0];
  $('msg').textContent='使用中の入力: '+(tk.label||'(名称なし)')+' / '+Math.round(ctx.sampleRate)+' Hz';
  if(!run){run=true;requestAnimationFrame(loop)}
 }catch(e){$('msg').textContent='マイクを開始できません: '+e.message}
}
$('go').onclick=start;
function loop(t){requestAnimationFrame(loop);if(!an||t-last<100)return;last=t;
 an.getFloatTimeDomainData(buf);let r=0;for(let i=0;i<buf.length;i++)r+=buf[i]*buf[i];r=Math.sqrt(r/buf.length);
 an.getFloatFrequencyData(fb);for(let i=0;i<fb.length;i++)if(!(fb[i]>-160))fb[i]=-160;
 $('lb').style.width=Math.max(0,Math.min(100,(20*Math.log10(r+1e-6)+70)/60*100))+'%';
 const now=performance.now();
 if(calUntil){calSum+=r;calN++;if(now>calUntil){noise=calSum/Math.max(1,calN);calUntil=0;$('nz').textContent='雑音 '+(20*Math.log10(noise+1e-6)).toFixed(0)+' dB(ゲインを変えたら、測り直し)'}}
 mode==='t'?tuner(r):chordLive(r,now)}
function tuner(r){
 const sr=ctx.sampleRate,bw=sr/an.fftSize,thr=+$('tth').value,tol=+$('tol').value;
 let idx=sel,res=null;
 if(sel>=0)res=noteScan(fb,bw,fq(tun[sel]),6,120,sr);
 else{let bs=-99;tun.forEach((m,i)=>{const x=noteScan(fb,bw,fq(m),3,120,sr);if(!x)return;const sc=x.prom-4*(x.k-1);if(sc>bs){bs=sc;idx=i;res=x}})}
 if(!res||res.prom<thr||(noise&&r<noise*1.5)){
  $('nt').textContent='–';$('ct').textContent='弦を弾いてください';
  $('info').textContent='検出の強さ: '+(res?res.prom.toFixed(0):'–')+' dB(しきい値 '+thr+' dB)';return}
 const h=hist[idx];h.push(res.cents);if(h.length>5)h.shift();
 const c=[...h].sort((a,b)=>a-b)[Math.floor(h.length/2)],ok=Math.abs(c)<=tol;
 $('nt').textContent=nm(tun[idx]);
 $('ct').textContent=(c>0?'+':'')+c.toFixed(0)+' cent'+(ok?'  ◎':'');
 $('info').textContent=res.k+'倍音で測定 / 検出の強さ '+res.prom.toFixed(0)+' dB';
 $('nd').style.left=Math.max(0,Math.min(100,50+c))+'%';
 $('nd').classList.toggle('ok',ok);
 okc[idx]=ok?(okc[idx]||0)+1:0;if(okc[idx]>=5)done[idx]=true;
 drawS(idx)}
function chordLive(r,now){
 const sr=ctx.sampleRate,bw=sr/an.fftSize,th=+$('cth').value,fr=CH[chord];
 const req=[...new Set(fr.map((f,i)=>f<0?-1:(STD[i]+f)%12).filter(x=>x>=0))];
 const st=[...Array(12).keys()].map(p=>pcStrength(fb,bw,p,sr,A4));
 const quiet=noise&&r<noise*1.5,miss=req.filter(p=>st[p]<th),active=!quiet&&st.some(v=>v>=th);
 if(active&&!miss.length){cok++;if(cok>=2)cokUntil=now+2000}else if(active)cok=0;
 let msg,col='';
 if(now<cokUntil){msg=chord+' OK ◎';col='var(--ok)'}
 else if(!active){msg='コードを弾いてください'}
 else{msg=chord+' 不足: '+miss.map(p=>NN[p]).join(' ');col='var(--ng)'}
 $('vd').textContent=msg;$('vd').style.color=col;
 $('cr').innerHTML=st.map((v,p)=>{const t=req.includes(p),h=Math.max(2,Math.min(100,Math.round(v/45*100)));
  return`<div class="${t?'t'+(v>=th?' ok':''):(v>=th?'x':'')}"><i style="height:${h}px"></i>${NN[p]}</div>`}).join('');
 $('cs').textContent='構成音の強さ(dB): '+req.map(p=>NN[p]+' '+st[p].toFixed(0)).join(' / ')}
if(typeof __hook==='function')__hook(e=>eval(e));
</script><div id="appver" style="position:fixed;top:calc(env(safe-area-inset-top,0px) + 36px);right:8px;z-index:99999;font:12px/1 ui-monospace,Menlo,monospace;color:#888;opacity:.8;pointer-events:none;user-select:none">v20261101202636</div>
</body></html>
